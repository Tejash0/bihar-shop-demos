<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - SaafKart</title>
  <meta name="theme-color" content="#1550E6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-checkout">
  <header class="top">
    <div class="top-in">
      <a class="logo" href="index.html" aria-label="SaafKart home">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#D4F53C"/><path d="M9 12h14l-1.4 11.2a2 2 0 0 1-2 1.8h-7.2a2 2 0 0 1-2-1.8L9 12Z" fill="#0B1B4D"/><path d="M12.5 12a3.5 3.5 0 0 1 7 0" fill="none" stroke="#0B1B4D" stroke-width="2.4" stroke-linecap="round"/><path d="M22.5 5.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z" fill="#1550E6"/></svg>
        <span>Saaf<b>Kart</b></span>
      </a>
      <a class="co-back" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        Keep shopping
      </a>
    </div>
  </header>
  <main class="co-main" id="checkout"></main>

  <script src="../../shared/packs.js"></script>
  <script src="../../shared/cart.js"></script>
  <script src="products.js"></script>
  <script>
    window.Shop.mountCheckout(window.Shop.init(window.SHOP), document.getElementById("checkout"));
    // Prefill the pincode the buyer already checked on the home page.
    (function () {
      var pin = null;
      try {
        pin = localStorage.getItem("saafkart:pin");
      } catch (e) {
        /* storage blocked: buyer types it */
      }
      var field = document.querySelector('#checkout [name="pincode"]');
      if (field && pin && window.SHOP.pincodes.indexOf(pin) !== -1) field.value = pin;
    })();
  </script>
</body>
</html>
